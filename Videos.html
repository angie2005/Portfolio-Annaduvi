</head>

<body>

  <header class="header">
    <nav class="nav container">

      <div class="menu" id="openMenu">
        <img src="img/Menu.png" alt="Menu">
      </div>
      
      <div class="side-menu" id="sideMenu">
        <div class="close-btn" id="closeMenu">✕</div>
        <ul>

          <li><a href="Contacto.html">Contacto</a></li>
        </ul>
      </div>

      <h1 class="logo">ANNADUVI</h1>

      <div class="socials">
        <a href="LINK PARA NAVEGAR"><img src="img/Buscar.png" alt="Buscar"> </a>
        <a href="https://www.instagram.com/"><img src="img/Instagram.png" alt="Instagram"> </a>

      </div>
    </nav>
  </header>

  <img src="img/Regla.png" alt="Separador">

  <main class="main-container container">
    <section class="videos-section">
      <h2>Edición de Videos</h2>

      <div class="videos-container">

        <div class="video-card">
          <video controls poster="images/poster.jpg">
            <source src="img/Video1.mp4" type="video/mp4">
            Tu navegador no soporta video.
          </video>
        </div>

        <div class="video-card">

            Tu navegador no soporta video.

  <img src="img/Regla.png" alt="Separador">

  <section class="newsletter">
    <div class="newsletter-box">
      <input type="email" placeholder="Escribe tu correo electrónico..." required>
      <button>Suscribirme</button>
    </div>
  </section>

  <footer class="footer">
    © 2026 ANNADUVI
  </footer>

  <script>
    const openMenu = document.getElementById("openMenu");
    const closeMenu = document.getElementById("closeMenu");
    const sideMenu = document.getElementById("sideMenu");
    
    openMenu.addEventListener("click", () => {
      sideMenu.classList.add("active");
    });
    
    closeMenu.addEventListener("click", () => {
      sideMenu.classList.remove("active");
    });
  </script>

</body>
</html>
